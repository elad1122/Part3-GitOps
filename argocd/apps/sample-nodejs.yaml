# Argo CD Application for the sample Node.js app.
# The CI/CD pipeline deploys a release by changing the chart's targetRevision below. The chart's
# appVersion is the default image tag, so that one line moves the chart and the image together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the Application removes its resources
spec:
  project: sample-nodejs
  sources:
    - repoURL: https://github.com/elad1122/Part2-Application.git
      path: helm/sample-nodejs
      targetRevision: v1.0.0
      helm:
        releaseName: sample-nodejs
        valueFiles:
          - $values/values/sample-nodejs/values.yaml
    - repoURL: https://github.com/elad1122/Part3-GitOps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # remove resources that disappear from Git
      selfHeal: true   # revert manual changes in the cluster
    retry:
      limit: 3
      backoff:
        duration: 30s
