# Argo CD Application for the sample Node.js app.
# Deploys the chart and its values.yaml from the app repo, following the newest release tag.
# Release tags are created by the CI/CD pipeline only after every security gate has passed and
# the image was pushed. The chart's appVersion at that tag is the image tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the Application removes its resources
spec:
  project: sample-nodejs
  source:
    repoURL: https://github.com/elad1122/Part2-Application.git
    path: helm/sample-nodejs
    targetRevision: ">=1.0.0"   # newest vX.Y.Z tag; set to an exact tag such as v1.0.0 to pin
    helm:
      releaseName: sample-nodejs
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # remove resources that disappear from Git
      selfHeal: true   # revert manual changes in the cluster
    retry:
      limit: 3
      backoff:
        duration: 30s
