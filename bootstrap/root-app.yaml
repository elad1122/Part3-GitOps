# Root ("app of apps"). The only manifest applied by hand, once:
#   kubectl apply -f bootstrap/root-app.yaml
# It watches argocd/ in this repo, so every project and Application there is managed from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elad1122/Part3-GitOps.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
